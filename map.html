<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MU Map 2.0</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0B0E14;
color:#E6E6E6;
text-align:center;
}

header{
padding:20px;
border-bottom:1px solid #222;
}

h1{
margin-top:40px;
font-size:42px;
}

.map{
max-width:600px;
margin:60px auto;
display:flex;
flex-direction:column;
gap:18px;
}

.node{
padding:18px;
border:1px solid #2a3342;
border-radius:12px;
background:#121826;
cursor:pointer;
transition:0.25s;
}

.node:hover{
background:#1a2233;
transform:scale(1.03);
}

.active{
border:1px solid #4aa3ff;
background:#16243a;
box-shadow:0 0 18px rgba(74,163,255,0.25);
}

.line{
opacity:0.4;
font-size:20px;
}
</style>
</head>

<body>

<header>
<b>MU SYSTEM MAP 2.0</b>
</header>

<h1>Interactive World Structure</h1>

<div class="map">

<div class="node" onclick="setActive(this)">
🏛 Gibraltar — Core System
</div>

<div class="line">↓</div>

<div class="node" onclick="setActive(this)">
🌉 Ceuta — Intercontinental Bridge
</div>

<div class="line">↓</div>

<div class="node" onclick="setActive(this)">
📚 Faculties — Knowledge System
</div>

</div>

<script>
function setActive(el){

// remove previous active
document.querySelectorAll('.node').forEach(n=>{
n.classList.remove('active');
});

// set new active
el.classList.add('active');
}
</script>

</body>
</html>
