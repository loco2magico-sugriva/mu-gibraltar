<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUoG Map</title>

<link rel="stylesheet" href="mu-core.css">

<style>
h1{
text-align:center;
margin-top:80px;
letter-spacing:4px;
}

.map-container{
max-width:900px;
margin:60px auto;
padding:20px;
text-align:center;
}

.node{
display:inline-block;
width:220px;
padding:22px;
margin:20px;
border-radius:16px;
background:linear-gradient(180deg,#121a2a,#0b101a);
border:1px solid #263246;
box-shadow:0 15px 40px rgba(0,0,0,0.5);
cursor:pointer;
transition:0.25s;
}

.node:hover{
transform:translateY(-6px);
border-color:#4aa3ff;
}

.line{
height:2px;
width:60%;
margin:30px auto;
background:linear-gradient(90deg,#4aa3ff,transparent);
opacity:0.6;
}

.tag{
opacity:0.6;
font-size:13px;
margin-top:6px;
}
</style>

</head>

<body>

<div class="world-banner">
MUoG • Monkeys University of Gibraltar • 
<span>Gibraltar (G-Rock State)</span> • G-System Active
</div>

<header>
<div><b>MUoG</b></div>

<nav>
<a href="index.html">Home</a>
<a href="season1.html">Season 1</a>
<a href="map.html">Map</a>
</nav>
</header>

<h1>MUoG WORLD MAP</h1>

<div class="map-container">

<div class="node" onclick="location.href='index.html'">
<h3>Gibraltar</h3>
<div class="tag">MUoG Core Campus</div>
</div>

<div class="line"></div>

<div class="node" onclick="location.href='ceuta.html'">
<h3>Ceuta</h3>
<div class="tag">Intercontinental Node</div>
</div>

<div class="line"></div>

<div class="node">
<h3>G-System</h3>
<div class="tag">Runtime Infrastructure Layer</div>
</div>

</div>

<footer style="text-align:center;padding:40px;opacity:0.5;">
MUoG — World Map System
</footer>

</body>
</html>
