<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MU Map 3.0</title>
<link rel="stylesheet" href="mu-core.css">
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0B0E14;
color:#E6E6E6;
text-align:center;
}

header{
padding:20px;
border-bottom:1px solid #222;
}

h1{
margin-top:35px;
font-size:42px;
}

.map{
max-width:600px;
margin:60px auto;
display:flex;
flex-direction:column;
gap:10px;
position:relative;
}

.node{
padding:18px;
border:1px solid #2a3342;
border-radius:12px;
background:#121826;
cursor:pointer;
transition:0.25s;
position:relative;
z-index:2;
}

.node:hover{
transform:scale(1.03);
background:#1a2233;
}

.active{
border:1px solid #4aa3ff;
background:#16243a;
box-shadow:0 0 18px rgba(74,163,255,0.25);
}

.line{
height:30px;
width:2px;
background:#2a3342;
margin:0 auto;
opacity:0.7;
transition:0.3s;
}

.line.active-line{
background:#4aa3ff;
box-shadow:0 0 10px rgba(74,163,255,0.4);
}

.info{
margin-top:40px;
color:#bdbdbd;
min-height:40px;
}
</style>
</head>

<body>

<header>
<b>MU SYSTEM MAP 3.0</b>
</header>

<h1>System Flow</h1>

<div class="map">

<div class="node" onclick="selectNode(this,'Gibraltar Core System')">
🏛 Gibraltar — Core System
</div>

<div class="line"></div>

<div class="node" onclick="selectNode(this,'Ceuta Bridge Layer')">
🌉 Ceuta — Intercontinental Bridge
</div>

<div class="line"></div>

<div class="node" onclick="selectNode(this,'Faculties Knowledge Layer')">
📚 Faculties — Knowledge System
</div>

</div>

<div class="info" id="info">
Kliknij w węzeł, aby aktywować warstwę systemu MU
</div>

<script>
function selectNode(el, text){

// reset nodes
document.querySelectorAll('.node').forEach(n=>{
n.classList.remove('active');
});

// reset lines
document.querySelectorAll('.line').forEach(l=>{
l.classList.remove('active-line');
});

// activate node
el.classList.add('active');

// activate previous line if exists
let prev = el.previousElementSibling;
if(prev && prev.classList.contains('line')){
prev.classList.add('active-line');
}

// update info
document.getElementById('info').innerText = "ACTIVE: " + text;
}
</script>

</body>
</html>
