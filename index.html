<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
body{
margin:0;
background:#070A10;
color:white;
font-family:Arial, sans-serif;
overflow:hidden;
}

/* INTRO */
.intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease 3s forwards;
}

.intro h1{
font-size:42px;
letter-spacing:6px;
opacity:0;
animation:fadeIn 1s ease forwards;
}

.intro p{
opacity:0;
animation:fadeIn 1s ease 1s forwards;
font-size:14px;
}

/* MAIN */
main{
opacity:0;
animation:show 0.6s ease 3.5s forwards;
padding:20px;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border-bottom:1px solid #1f2a3a;
}

nav a{
color:white;
text-decoration:none;
margin-right:15px;
opacity:0.7;
transition:0.2s;
}

nav a:hover{
color:#4aa3ff;
opacity:1;
}

/* LANG */
.lang button{
background:none;
border:1px solid #4aa3ff;
color:#4aa3ff;
padding:4px 8px;
margin-left:5px;
cursor:pointer;
transition:0.2s;
}

.lang button:hover{
background:#4aa3ff;
color:black;
}

/* HERO */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:60px;
margin:0;
}

.hero p{
opacity:0.7;
}

/* CARD */
.card{
max-width:800px;
margin:20px auto;
padding:20px;
background:#111827;
border-radius:12px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
max-width:900px;
margin:30px auto;
}

.box{
background:#111827;
padding:20px;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:0.2s;
border:1px solid transparent;
}

.box:hover{
transform:translateY(-4px);
border:1px solid #4aa3ff;
}

/* ANIMATIONS */
@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden; pointer-events:none;}
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro">
<h1>G-ROCK PRESENTS</h1>
<p>Monkeys University of Gibraltar • Powered by G-System</p>
</div>

<!-- MAIN -->
<main>

<header>
<div><b>Monkeys University of Gibraltar</b></div>

<nav>
<a href="index.html">Home</a>
<a href="map.html">Map</a>
<a href="season1.html">Episodes</a>
<a href="g-system.html">System</a>
</nav>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('pl')">PL</button>
<button onclick="setLang('fr')">FR</button>
</div>
</header>

<section class="hero">
<h1>G-ROCK</h1>
<p id="text">Powered by G-System</p>
</section>

<div class="card">
<h2>Professor Sugriva</h2>
<p>First documented subject integrated into ESL / BSU system.</p>
</div>

<div class="grid">
<div class="box" onclick="location.href='gibraltar.html'">City</div>
<div class="box" onclick="location.href='faculties.html'">Faculties</div>
<div class="box" onclick="location.href='g-system.html'">System Core</div>
</div>

</main>

<script>
const texts = {
en:"Powered by G-System",
es:"Impulsado por G-System",
pl:"Napędzane przez G-System",
fr:"Propulsé por G-System"
};

function setLang(l){
document.getElementById("text").innerText = texts[l];
}
</script>

</body>
</html>
