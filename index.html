<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK DASHBOARD</title>

<style>
body{
margin:0;
background:#05070d;
color:white;
font-family:Arial, sans-serif;
overflow:auto;
}

/* INTRO */
.intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease 3s forwards;
}

.intro h1{
font-size:50px;
letter-spacing:8px;
opacity:0;
animation:fadeIn 1s ease forwards;
}

.intro p{
opacity:0;
font-size:14px;
animation:fadeIn 1s ease 1s forwards;
color:#aaa;
}

/* LAYOUT */
main{
opacity:0;
animation:show 0.8s ease 3.6s forwards;
display:flex;
min-height:100vh;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#0b1220;
padding:20px;
border-right:1px solid #1a2233;
}

.sidebar h3{
margin-top:0;
color:#4aa3ff;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
margin:15px 0;
opacity:0.7;
transition:0.2s;
}

.sidebar a:hover{
opacity:1;
color:#4aa3ff;
}

/* CONTENT */
.content{
flex:1;
padding:30px;
}

/* HEADER */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.lang button{
background:none;
border:1px solid #4aa3ff;
color:#4aa3ff;
padding:5px 10px;
margin-left:5px;
cursor:pointer;
}

.lang button:hover{
background:#4aa3ff;
color:black;
}

/* HERO */
.hero h1{
font-size:65px;
margin:0;
}

.hero p{
opacity:0.7;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:30px;
}

.card{
background:#0f1626;
padding:20px;
border-radius:14px;
border:1px solid #1f2a3a;
cursor:pointer;
transition:0.25s;
position:relative;
overflow:hidden;
}

.card:hover{
transform:translateY(-6px);
border-color:#4aa3ff;
box-shadow:0 0 20px rgba(74,163,255,0.25);
}

/* preview glow */
.card::after{
content:"";
position:absolute;
inset:0;
background:radial-gradient(circle at center, rgba(74,163,255,0.2), transparent);
opacity:0;
transition:0.3s;
}

.card:hover::after{
opacity:1;
}

/* ANIM */
@keyframes fadeIn{
from{opacity:0; transform:translateY(15px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden;}
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro">
<h1>G-ROCK DASHBOARD</h1>
<p>Monkey University of Gibraltar • Powered by G-System</p>
</div>

<main>

<!-- SIDEBAR -->
<div class="sidebar">
<h3>G-ROCK</h3>
<a href="#">Home</a>
<a href="#">Gibraltar</a>
<a href="#">Ceuta</a>
<a href="#">Faculties</a>
<a href="#">System Core</a>
</div>

<!-- CONTENT -->
<div class="content">

<div class="topbar">
<div id="title"><b>Monkey University of Gibraltar</b></div>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('pl')">PL</button>
<button onclick="setLang('fr')">FR</button>
</div>
</div>

<div class="hero">
<h1>G-ROCK</h1>
<p id="text">Powered by G-System</p>
</div>

<div class="grid">

<div class="card">Gibraltar Node</div>
<div class="card">Ceuta Node</div>
<div class="card">Faculties Layer</div>
<div class="card">System Core</div>

</div>

</div>

</main>

<script>
const texts = {
en:"Powered by G-System",
es:"Impulsado por G-System",
pl:"Napędzane przez G-System",
fr:"Propulsé par G-System"
};

const titles = {
en:"Monkey University of Gibraltar",
es:"Universidad de Gibraltar",
pl:"Uniwersytet Gibraltarski",
fr:"Université de Gibraltar"
};

function setLang(l){
document.getElementById("text").innerText = texts[l];
document.getElementById("title").innerText = titles[l];
}
</script>

</body>
</html>
