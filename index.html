<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock</title>

<link rel="stylesheet" href="mu-core.css">

<style>
body{
margin:0;
background:#070A10;
color:#E6E6E6;
font-family:Arial, sans-serif;
}

/* BANNER */
.world-banner{
width:100%;
background:rgba(10,12,18,0.95);
border-bottom:1px solid #1f2a3a;
text-align:center;
padding:10px;
font-size:12px;
letter-spacing:1px;
opacity:0.9;
position:sticky;
top:0;
z-index:200;
}

.world-banner span{
color:#4aa3ff;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 22px;
border-bottom:1px solid #1f2a3a;
}

nav a{
color:#E6E6E6;
text-decoration:none;
margin-left:12px;
font-size:14px;
opacity:0.8;
}

nav a:hover{
color:#4aa3ff;
opacity:1;
}

/* LANGUAGE */
.lang{
font-size:12px;
opacity:0.8;
}

.lang a{
color:#aaa;
text-decoration:none;
margin-left:6px;
}

.lang a:hover{
color:#4aa3ff;
}

/* HERO */
.hero{
text-align:center;
padding:110px 20px 60px;
background:radial-gradient(circle at top, rgba(74,163,255,0.18), transparent 60%);
}

.hero h1{
font-size:72px;
letter-spacing:10px;
margin:0;
}

.subtitle{
margin-top:10px;
opacity:0.6;
letter-spacing:3px;
font-size:12px;
}

/* FEATURE */
.feature{
max-width:900px;
margin:50px auto 0;
padding:28px;
border-radius:16px;
background:linear-gradient(180deg,#121a2a,#0b101a);
border:1px solid #263246;
text-align:left;
}

.badge{
display:inline-block;
padding:6px 12px;
border:1px solid #4aa3ff;
border-radius:20px;
font-size:11px;
opacity:0.8;
margin-bottom:12px;
}

.cta{
display:inline-block;
margin-top:18px;
padding:11px 16px;
border:1px solid #4aa3ff;
color:#4aa3ff;
border-radius:10px;
text-decoration:none;
}

/* GRID */
.grid{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
padding:50px 20px;
}

.card{
width:280px;
padding:20px;
border-radius:14px;
background:linear-gradient(180deg,#141a28,#0c111b);
border:1px solid #263246;
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:translateY(-6px);
border-color:#4aa3ff;
}

.card p{
opacity:0.7;
font-size:14px;
}

/* FOOTER */
footer{
text-align:center;
padding:40px;
opacity:0.5;
font-size:12px;
}
</style>

</head>

<body>

<div class="world-banner">
G-ROCK • Digital Universe Platform • 
<span>MUO-G System Layer Active</span> • Gibraltar Core Node
</div>
