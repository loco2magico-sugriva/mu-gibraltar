<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MU OS PRO</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0B0E14;
color:#E6E6E6;
overflow:hidden;
}

/* TOP BAR */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 22px;
border-bottom:1px solid #222;
background:#0E1118;
}

.title{
font-weight:bold;
letter-spacing:1px;
}

/* NAV */
nav button{
background:none;
border:1px solid #2a3342;
color:#E6E6E6;
padding:8px 12px;
margin-left:6px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

nav button:hover{
background:#1a2233;
transform:scale(1.05);
}

/* VIEWS */
.view{
position:absolute;
top:60px;
left:0;
width:100%;
height:calc(100% - 60px);
padding:60px 20px;
text-align:center;

opacity:0;
transform:translateY(15px);
pointer-events:none;
transition:0.35s ease;
}

.view.active{
opacity:1;
transform:translateY(0);
pointer-events:auto;
}

/* CARD */
.card{
margin-top:20px;
padding:22px;
border:1px solid #2a3342;
border-radius:12px;
background:#121826;
display:inline-block;
min-width:280px;
box-shadow:0 0 0 rgba(0,0,0,0);
transition:0.2s;
}

.card:hover{
box-shadow:0 0 18px rgba(74,163,255,0.15);
transform:scale(1.03);
}

h1{
margin-top:0;
}
</style>
</head>

<body>

<header>
<div class="title">MU OS PRO</div>

<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('gib')">Gibraltar</button>
<button onclick="show('ceuta')">Ceuta</button>
<button onclick="show('fac')">Faculties</button>
</nav>
</header>

<!-- HOME -->
<div id="home" class="view active">
<h1>MU CONTROL SYSTEM</h1>
<p>Unified operating interface for MU architecture</p>
</div>

<!-- GIBRALTAR -->
<div id="gib" class="view">
<h1>Gibraltar Core</h1>
<div class="card">Central intelligence layer of MU system</div>
</div>

<!-- CEUTA -->
<div id="ceuta" class="view">
<h1>Ceuta Bridge</h1>
<div class="card">Intercontinental transition node</div>
</div>

<!-- FACULTIES -->
<div id="fac" class="view">
<h1>Faculties System</h1>
<div class="card">Humanities • Technology • History Layer</div>
</div>

<script>
function show(id){

document.querySelectorAll('.view').forEach(v=>{
v.classList.remove('active');
});

document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
