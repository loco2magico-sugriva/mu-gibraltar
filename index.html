<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MU System Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0B0E14;
color:#E6E6E6;
}

header{
padding:20px 30px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
align-items:center;
}

h1{
text-align:center;
margin-top:50px;
font-size:44px;
}

.sub{
text-align:center;
color:#bdbdbd;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:900px;
margin:60px auto;
padding:0 20px;
}

.card{
background:#121826;
border:1px solid #2a3342;
border-radius:12px;
padding:20px;
text-align:center;
cursor:pointer;
transition:0.2s;
text-decoration:none;
color:#E6E6E6;
display:block;
}

.card:hover{
transform:scale(1.03);
background:#1a2233;
}

.small{
color:#bdbdbd;
font-size:14px;
margin-top:8px;
}
</style>
</head>

<body>

<header>
<div><b>MU SYSTEM</b></div>
<div>Dashboard</div>
</header>

<h1>MU Control System</h1>
<div class="sub">Unified interface for Gibraltar, Ceuta and Faculties</div>

<div class="grid">

<a class="card" href="index.html">
🏛 Gibraltar Core
<div class="small">Main system hub</div>
</a>

<a class="card" href="ceuta.html">
🌉 Ceuta Bridge
<div class="small">Intercontinental transfer layer</div>
</a>

<a class="card" href="faculties.html">
📚 Faculties
<div class="small">Knowledge architecture</div>
</a>

<a class="card" href="map.html">
🌍 MU Map
<div class="small">System topology view</div>
</a>

</div>

</body>
</html>
