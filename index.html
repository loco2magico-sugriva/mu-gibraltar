<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MU OS</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0B0E14;
color:#E6E6E6;
overflow:hidden;
}

header{
padding:18px 24px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
}

nav button{
background:none;
border:1px solid #2a3342;
color:#E6E6E6;
padding:8px 12px;
margin-left:8px;
border-radius:8px;
cursor:pointer;
}

nav button:hover{
background:#1a2233;
}

.view{
display:none;
padding:60px 20px;
text-align:center;
animation:fade 0.3s ease;
}

.active{
display:block;
}

@keyframes fade{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

.card{
margin-top:20px;
padding:20px;
border:1px solid #2a3342;
border-radius:12px;
background:#121826;
display:inline-block;
min-width:260px;
}
</style>
</head>

<body>

<header>
<div><b>MU OS SYSTEM</b></div>

<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('gib')">Gibraltar</button>
<button onclick="show('ceuta')">Ceuta</button>
<button onclick="show('fac')">Faculties</button>
</nav>
</header>

<!-- HOME -->
<div id="home" class="view active">
<h1>MU CONTROL SYSTEM</h1>
<p>Unified operating system interface</p>
</div>

<!-- GIBRALTAR -->
<div id="gib" class="view">
<h1>Gibraltar Core</h1>
<div class="card">Main system nucleus</div>
</div>

<!-- CEUTA -->
<div id="ceuta" class="view">
<h1>Ceuta Bridge</h1>
<div class="card">Intercontinental transfer layer</div>
</div>

<!-- FACULTIES -->
<div id="fac" class="view">
<h1>Faculties</h1>
<div class="card">Humanities / Tech / History System</div>
</div>

<script>
function show(id){

document.querySelectorAll('.view').forEach(v=>{
v.classList.remove('active');
});

document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
