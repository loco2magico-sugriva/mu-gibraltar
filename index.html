<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-font-smoothing:antialiased;
text-rendering:geometricPrecision;
font-family:Arial, sans-serif;
}

body{
background:#05070d;
color:white;
}

/* INTRO */
.intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 0.8s ease 2.5s forwards;
}

.intro h1{
font-size:52px;
letter-spacing:8px;
text-transform:uppercase;
opacity:0;
animation:fadeIn 0.6s ease forwards;
}

.intro p{
font-size:14px;
margin-top:10px;
opacity:0;
color:#aaa;
animation:fadeIn 0.6s ease 0.6s forwards;
text-transform:uppercase;
text-align:center;
}

/* MAIN */
main{
opacity:0;
animation:show 0.6s ease 2.6s forwards;
padding:20px;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border-bottom:1px solid #1a2233;
}

header div{
text-transform:uppercase;
letter-spacing:1px;
}

nav a{
color:white;
text-decoration:none;
margin-right:12px;
opacity:0.7;
}

nav a:hover{
opacity:1;
color:#4aa3ff;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:30px;
}

.box{
background:#0f1626;
padding:25px;
border-radius:12px;
text-align:center;
text-transform:uppercase;
border:1px solid transparent;
transition:0.2s;
}

.box:hover{
border:1px solid #4aa3ff;
transform:translateY(-5px);
}

/* ANIMATIONS */
@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<div class="intro">
<h1>G-ROCK PRESENTS</h1>
<p>MONKEYS UNIVERSITY OF GIBRALTAR • POWERED BY G-SYSTEM</p>
</div>

<main>

<header>
<div>MONKEYS UNIVERSITY OF GIBRALTAR</div>

<nav>
<a href="#">HOME</a>
<a href="#">MAP</a>
<a href="#">EPISODES</a>
<a href="#">SYSTEM</a>
</nav>
</header>

<section style="text-align:center;margin-top:50px;">
<h1>G-ROCK</h1>
<p>Powered by G-System</p>
</section>

<div class="grid">
<div class="box">Gibraltar</div>
<div class="box">Ceuta</div>
<div class="box">Faculty</div>
<div class="box">System Core</div>
</div>

</main>

</body>
</html>
