<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
body{
margin:0;
background:#05070d;
color:white;
font-family:Arial, sans-serif;
overflow:auto;
}

/* ===== INTRO ===== */
.intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease 3.2s forwards;
}

.intro h1{
font-size:48px;
letter-spacing:8px;
opacity:0;
animation:fadeIn 1s ease forwards;
}

.intro p{
opacity:0;
font-size:14px;
animation:fadeIn 1s ease 1s forwards;
color:#aaa;
}

/* ===== MAIN ===== */
main{
opacity:0;
animation:show 0.8s ease 3.8s forwards;
padding:20px;
}

/* ===== HEADER ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
border-bottom:1px solid #1a2233;
}

nav a{
color:white;
text-decoration:none;
margin-right:15px;
opacity:0.7;
transition:0.2s;
}

nav a:hover{
opacity:1;
color:#4aa3ff;
text-shadow:0 0 10px #4aa3ff;
}

/* ===== LANG ===== */
.lang button{
background:none;
border:1px solid #4aa3ff;
color:#4aa3ff;
padding:5px 10px;
margin-left:5px;
cursor:pointer;
transition:0.2s;
}

.lang button:hover{
background:#4aa3ff;
color:black;
box-shadow:0 0 10px #4aa3ff;
}

/* ===== HERO ===== */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:70px;
margin:0;
letter-spacing:3px;
}

.hero p{
opacity:0.7;
}

/* ===== CARD ===== */
.card{
max-width:800px;
margin:20px auto;
padding:20px;
background:#0f1626;
border-radius:14px;
border:1px solid #1f2a3a;
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
max-width:900px;
margin:40px auto;
}

.box{
background:#0f1626;
padding:25px;
border-radius:14px;
text-align:center;
cursor:pointer;
transition:0.25s;
border:1px solid transparent;
}

.box:hover{
transform:translateY(-6px);
border:1px solid #4aa3ff;
box-shadow:0 0 18px rgba(74,163,255,0.3);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{
from{opacity:0; transform:translateY(15px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden; pointer-events:none;}
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro">
<h1>G-ROCK PRESENTS</h1>
<p>Monkeys University of Gibraltar • Powered by G-System</p>
</div>

<!-- MAIN -->
<main>

<header>
<div><b id="title">Monkeys University of Gibraltar</b></div>

<nav>
<a href="#">Home</a>
<a href="#">Map</a>
<a href="#">Episodes</a>
<a href="#">System</a>
</nav>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('pl')">PL</button>
<button onclick="setLang('fr')">FR</button>
</div>
</header>

<section class="hero">
<h1>G-ROCK</h1>
<p id="text">Powered by G-System</p>
</section>

<div class="card">
<h2>Professor Sugriva</h2>
<p>First documented subject integrated into system core archive.</p>
</div>

<div class="grid">

<div class="box" onclick="alert('Gibraltar node')">Gibraltar</div>
<div class="box" onclick="alert('Ceuta node')">Ceuta</div>
<div class="box" onclick="alert('Faculties layer')">Faculties</div>
<div class="box" onclick="alert('System Core active')">System Core</div>

</div>

</main>

<script>
const texts = {
en:"Powered by G-System",
es:"Impulsado por G-System",
pl:"Napędzane przez G-System",
fr:"Propulsé par G-System"
};

const titles = {
en:"Monkeys University of Gibraltar",
es:"Universidad de Gibraltar",
pl:"Uniwersytet Gibraltarski Małp",
fr:"Université de Gibraltar"
};

function setLang(l){
document.getElementById("text").innerText = texts[l];
document.getElementById("title").innerText = titles[l];
}
</script>

</body>
                                                              </html>
