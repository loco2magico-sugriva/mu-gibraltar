<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
body{
margin:0;
background:#070A10;
color:white;
font-family:Arial, sans-serif;
overflow:hidden;
}

/* INTRO */
.intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease 3.5s forwards;
}

.intro h1{
font-size:42px;
letter-spacing:6px;
opacity:0;
animation:fadeIn 1.2s ease forwards;
}

.intro p{
opacity:0;
animation:fadeIn 1.2s ease 0.8s forwards;
font-size:14px;
}

/* MAIN */
main{
opacity:0;
animation:show 0.6s ease 4s forwards;
padding:20px;
}

/* HEADER MENU */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border-bottom:1px solid #1f2a3a;
}

nav a{
color:white;
text-decoration:none;
margin-right:15px;
opacity:0.8;
}

nav a:hover{
color:#4aa3ff;
}

/* HERO */
.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:60px;
margin:0;
}

.hero p{
opacity:0.7;
}

/* CARD */
.card{
max-width:800px;
margin:20px auto;
padding:20px;
background:#111827;
border-radius:12px;
}

/* FOOTER */
footer{
text-align:center;
padding:30px;
opacity:0.5;
font-size:12px;
}

/* ANIMATIONS */
@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden;}
}

@keyframes show{
to{opacity:1;}
from{opacity:0;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro">
<h1>G-ROCK PRESENTS</h1>
<p>Powered by G-System</p>
</div>

<!-- MAIN -->
<main>

<header>
<div><b>Monkeys University of Gibraltar</b></div>

<nav>
<a href="index.html">Home</a>
<a href="map.html">Map</a>
<a href="season1.html">Episodes</a>
<a href="g-system.html">System</a>
</nav>
</header>

<section class="hero">
<h1>G-ROCK</h1>
<p>Powered by G-System</p>
</section>

<div class="card">
<h2>Professor Sugriva</h2>
<p>First documented subject integrated into ESL / BSU system.</p>
</div>

<footer>
G-ROCK • Monkeys University of Gibraltar
</footer>

</main>

</body>
</html>
