<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock</title>

<style>
body{
margin:0;
background:#070A10;
color:#E6E6E6;
font-family:Arial, sans-serif;
}

.world-banner{
background:#0b0f18;
padding:10px;
text-align:center;
font-size:12px;
border-bottom:1px solid #1f2a3a;
}

header{
display:flex;
justify-content:space-between;
padding:18px;
border-bottom:1px solid #1f2a3a;
}

nav a{
color:#fff;
text-decoration:none;
margin-left:10px;
opacity:0.7;
}

.lang button{
background:none;
border:1px solid #4aa3ff;
color:#4aa3ff;
padding:5px 8px;
margin-left:5px;
cursor:pointer;
font-size:12px;
}

.hero{
text-align:center;
padding:90px 20px;
}

.hero h1{
font-size:60px;
letter-spacing:8px;
}

.card{
max-width:800px;
margin:20px auto;
padding:20px;
border:1px solid #263246;
border-radius:12px;
}
</style>
</head>

<body>

<div class="world-banner" data-i18n="banner">
G-ROCK • Digital Universe Platform • MUO-G Active • Gibraltar Core Node
</div>

<header>
<div><b>G-ROCK</b></div>

<nav>
<a href="#" data-i18n="home">Home</a>
<a href="#" data-i18n="series">Series</a>
<a href="#" data-i18n="map">Map</a>
<a href="#" data-i18n="system">System</a>
</nav>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('pl')">PL</button>
<button onclick="setLang('fr')">FR</button>
</div>
</header>

<section class="hero">
<h1 data-i18n="title">G-ROCK</h1>
<p data-i18n="subtitle">Digital Universe Platform</p>

<div class="card">
<h2 data-i18n="episode">Episode 1 — Sugriwa Initialization</h2>
<p data-i18n="desc">
A system anomaly originating from Gibraltar Core Node. First interaction between reality layers and G-System.
</p>
</div>
</section>

<script>
// 🌍 TRANSLATIONS
const translations = {
en:{
banner:"G-ROCK • Digital Universe Platform • MUO-G Active • Gibraltar Core Node",
home:"Home",
series:"Series",
map:"Map",
system:"System",
title:"G-ROCK",
subtitle:"Digital Universe Platform",
episode:"Episode 1 — Sugriwa Initialization",
desc:"A system anomaly originating from Gibraltar Core Node. First interaction between reality layers and G-System."
},
es:{
banner:"G-ROCK • Plataforma Digital • MUO-G Activo • Núcleo Gibraltar",
home:"Inicio",
series:"Serie",
map:"Mapa",
system:"Sistema",
title:"G-ROCK",
subtitle:"Plataforma del Universo Digital",
episode:"Episodio 1 — Inicialización Sugriwa",
desc:"Una anomalía del sistema originada en el Núcleo de Gibraltar. Primera interacción entre capas de realidad y G-System."
},
pl:{
banner:"G-ROCK • Platforma Cyfrowego Uniwersum • MUO-G Aktywny • Rdzeń Gibraltar",
home:"Start",
series:"Serial",
map:"Mapa",
system:"System",
title:"G-ROCK",
subtitle:"Platforma Cyfrowego Uniwersum",
episode:"Odcinek 1 — Inicjalizacja Sugriwa",
desc:"Anomalia systemowa pochodząca z rdzenia Gibraltar. Pierwsza interakcja warstw rzeczywistości z G-System."
},
fr:{
banner:"G-ROCK • Plateforme Univers Numérique • MUO-G Actif • Noyau Gibraltar",
home:"Accueil",
series:"Série",
map:"Carte",
system:"Système",
title:"G-ROCK",
subtitle:"Plateforme de l'Univers Numérique",
episode:"Épisode 1 — Initialisation Sugriwa",
desc:"Une anomalie système provenant du noyau de Gibraltar. Première interaction entre les couches de réalité et le G-System."
}
};

// 🌍 CHANGE LANGUAGE
function setLang(lang){
document.querySelectorAll("[data-i18n]").forEach(el=>{
const key = el.getAttribute("data-i18n");
el.innerText = translations[lang][key];
});
}
</script>

</body>
</html>
