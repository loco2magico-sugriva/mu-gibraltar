<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MU Boot Sequence</title>

<style>
body{
margin:0;
background:#0B0E14;
color:#E6E6E6;
font-family:Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
overflow:hidden;
}

.boot{
text-align:center;
max-width:600px;
}

.title{
font-size:42px;
letter-spacing:2px;
margin-bottom:20px;
}

.line{
opacity:0;
animation:fade 1s forwards;
margin:6px 0;
color:#bdbdbd;
}

.line:nth-child(2){animation-delay:0.5s;}
.line:nth-child(3){animation-delay:1.2s;}
.line:nth-child(4){animation-delay:2s;}
.line:nth-child(5){animation-delay:2.8s;}

.bar{
margin-top:30px;
width:100%;
height:10px;
border:1px solid #2a3342;
border-radius:6px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#4aa3ff;
animation:load 4s forwards;
}

.enter{
margin-top:30px;
opacity:0;
animation:show 1s forwards;
animation-delay:4.2s;
}

button{
background:none;
border:1px solid #4aa3ff;
color:#4aa3ff;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#16243a;
}

@keyframes fade{
to{opacity:1;}
}

@keyframes load{
to{width:100%;}
}

@keyframes show{
to{opacity:1;}
}
</style>
</head>

<body>

<div class="boot">

<div class="title">MU SYSTEM BOOT</div>

<div class="line">Initializing Gibraltar Core...</div>
<div class="line">Connecting Ceuta Bridge...</div>
<div class="line">Loading Faculties System...</div>
<div class="line">Activating Wojtek Layer...</div>

<div class="bar">
<div class="fill"></div>
</div>

<div class="enter">
<button onclick="enter()">ENTER MU SYSTEM</button>
</div>

</div>

<script>
function enter(){
window.location.href = "index.html";
}
</script>

</body>
</html>
