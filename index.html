<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#05070d;
color:white;
}

/* INTRO */
.intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 0.8s ease 2.5s forwards;
}

.intro h1{
font-size:48px;
letter-spacing:6px;
text-transform:uppercase;
}

.intro p{
opacity:0.7;
margin-top:10px;
}

/* MAIN */
main{
opacity:0;
animation:show 0.8s ease 2.6s forwards;
padding:20px;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border-bottom:1px solid #1a2233;
}

nav a{
color:white;
text-decoration:none;
margin-right:10px;
opacity:0.7;
}

nav a:hover{
opacity:1;
color:#4aa3ff;
}

/* LANG */
.lang button{
background:none;
border:1px solid #4aa3ff;
color:#4aa3ff;
padding:5px 10px;
cursor:pointer;
margin-left:5px;
}

.lang button:hover{
background:#4aa3ff;
color:black;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:30px;
}

.box{
background:#0f1626;
padding:20px;
border-radius:10px;
text-align:center;
cursor:pointer;
}

/* ANIM */
@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro">
<h1>G-ROCK PRESENTS</h1>
<p>Monkeys University of Gibraltar • Powered by G-System</p>
</div>

<main>

<header>
<div id="title">Monkeys University of Gibraltar</div>

<nav>
<a href="#">Home</a>
<a href="#">Map</a>
<a href="#">Episodes</a>
<a href="#">System</a>
</nav>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('pl')">PL</button>
<button onclick="setLang('fr')">FR</button>
</div>
</header>

<section style="text-align:center;margin-top:40px;">
<h1>G-ROCK</h1>
<p id="subtitle">Powered by G-System</p>
</section>

<div class="grid">

<div class="box" id="gibraltar">Gibraltar</div>
<div class="box" id="ceuta">Ceuta</div>
<div class="box" id="faculty">Faculty</div>
<div class="box">System Core</div>

</div>

</main>

<script>
const langData = {
en:{
title:"Monkeys University of Gibraltar",
subtitle:"Powered by G-System",
gibraltar:"Gibraltar",
ceuta:"Ceuta",
faculty:"Faculty"
},
es:{
title:"Universidad de los Monos de Gibraltar",
subtitle:"Impulsado por G-System",
gibraltar:"Gibraltar",
ceuta:"Ceuta",
faculty:"Facultad"
},
pl:{
title:"Uniwersytet Małp Gibraltar",
subtitle:"Napędzane przez G-System",
gibraltar:"Gibraltar",
ceuta:"Ceuta",
faculty:"Wydział"
},
fr:{
title:"Université des Singes de Gibraltar",
subtitle:"Propulsé par G-System",
gibraltar:"Gibraltar",
ceuta:"Ceuta",
faculty:"Faculté"
}
};

function setLang(l){
document.getElementById("title").innerText = langData[l].title;
document.getElementById("subtitle").innerText = langData[l].subtitle;

document.getElementById("gibraltar").innerText = langData[l].gibraltar;
document.getElementById("ceuta").innerText = langData[l].ceuta;
document.getElementById("faculty").innerText = langData[l].faculty;
}
</script>

</body>
</html>
