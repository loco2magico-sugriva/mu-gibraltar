<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#070A10;
color:#E6E6E6;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

nav a{
color:white;
text-decoration:none;
margin-right:14px;
opacity:0.8;
}

nav a:hover{
opacity:1;
color:#4aa3ff;
}

/* HERO */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:44px;
margin:0;
letter-spacing:3px;
}

.hero p{
opacity:0.7;
margin-top:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
max-width:900px;
margin:40px auto;
padding:0 20px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
text-align:center;
border:1px solid #1f2a3a;
cursor:pointer;
}

.card:hover{
border-color:#4aa3ff;
transform:translateY(-4px);
transition:0.2s;
}

/* FOOTER */
footer{
text-align:center;
padding:40px;
opacity:0.5;
font-size:12px;
}
</style>

</head>

<body>

<header>
<div><b>G-ROCK SYSTEM</b></div>

<nav>

<a href="ceuta.html">Ceuta</a>
<a href="faculties.html">Faculties</a>
<a href="season1.html">Season 1</a>
</nav>
</header>

<section class="hero">
<h1>G-ROCK WORLD</h1>
<p>Distributed Academic Simulation System</p>
</section>

<section class="grid">

<div class="card" onclick="location.href='ceuta.html'">CEUTA</div>
<div class="card" onclick="location.href='faculties.html'">FACULTIES</div>
<div class="card" onclick="location.href='season1.html'">SEASON 1</div>
<div class="card" onclick="location.href='episode1.html'">EPISODE 1</div>

</section>

<footer>
G-ROCK SYSTEM • CLEAN BUILD
</footer>

</body>
</html>
