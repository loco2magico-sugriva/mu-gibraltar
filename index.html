<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
body{
margin:0;
background:#070A10;
color:white;
font-family:Arial, sans-serif;
overflow:hidden;
}

/* INTRO */
.intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.line{
opacity:0;
font-size:20px;
letter-spacing:3px;
margin:6px 0;
animation:show 1.2s ease forwards;
}

.line:nth-child(1){ animation-delay:0.3s; font-size:34px; }
.line:nth-child(2){ animation-delay:1.4s; }
.line:nth-child(3){ animation-delay:2.6s; font-size:14px; opacity:0.7; }

.intro{
animation:fadeOut 1s ease 4s forwards;
}

/* MAIN */
main{
opacity:0;
animation:showMain 0.6s ease 4.5s forwards;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
border-bottom:1px solid #1f2a3a;
}

.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:60px;
margin:0;
}

.card{
max-width:800px;
margin:20px auto;
padding:20px;
background:#111827;
border-radius:12px;
}

/* ANIMATIONS */
@keyframes show{
from{opacity:0; transform:translateY(10px); filter:blur(6px);}
to{opacity:1; transform:translateY(0); filter:blur(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden; pointer-events:none;}
}

@keyframes showMain{
to{opacity:1;}
from{opacity:0;}
}
</style>
</head>

<body>

<!-- INTRO SEQUENCE -->
<div class="intro">
<div class="line">G-ROCK PRESENTS</div>
<div class="line">Monkeys University of Gibraltar</div>
<div class="line">Powered by G-System</div>
</div>

<!-- MAIN -->
<main>

<header>
<div><b>G-ROCK</b></div>
<nav>
<a href="index.html">Home</a>
<a href="map.html">Map</a>
<a href="season1.html">Episodes</a>
<a href="g-system.html">System</a>
</nav>
</header>

<section class="hero">
<h1>G-ROCK</h1>
<p>World System Active</p>
</section>

<div class="card">
<h2>Professor Sugriva</h2>
<p>First documented subject integrated into ESL / BSU system.</p>
</div>

</main>

</body>
</html>
