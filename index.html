<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
body{
margin:0;
background:#070A10;
color:#E6E6E6;
font-family:Arial, sans-serif;
opacity:0;
animation:boot 0.8s ease forwards;
overflow-x:hidden;
}

/* =========================
   BOOT ANIMATION
========================= */

@keyframes boot{
from{
opacity:0;
transform:translateY(12px);
filter:blur(6px);
}
to{
opacity:1;
transform:translateY(0);
filter:blur(0);
}
}

/* =========================
   TOP BANNER
========================= */

.world-banner{
text-align:center;
padding:10px;
font-size:12px;
border-bottom:1px solid #1f2a3a;
background:#0b0f18;
letter-spacing:1px;
}

/* =========================
   HEADER
========================= */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
border-bottom:1px solid #1f2a3a;
}

.logo{
font-weight:bold;
letter-spacing:2px;
}

/* NAV */

nav a{
color:#fff;
text-decoration:none;
margin-right:14px;
opacity:0.8;
transition:0.2s;
}

nav a:hover{
color:#4aa3ff;
opacity:1;
transform:translateY(-1px);
}

/* =========================
   LANG
========================= */

.lang button{
background:none;
border:1px solid #4aa3ff;
color:#4aa3ff;
padding:4px 8px;
margin-left:5px;
cursor:pointer;
transition:0.2s;
}

.lang button:hover{
background:#4aa3ff;
color:#000;
}

/* =========================
   HERO
========================= */

.hero{
text-align:center;
padding:80px 20px 40px;
animation:fadeUp 0.8s ease forwards;
opacity:0;
animation-delay:0.2s;
}

.hero h1{
font-size:64px;
letter-spacing:8px;
margin:0;
}

.hero p{
opacity:0.7;
}

/* =========================
   CARD
========================= */

.card{
max-width:800px;
margin:30px auto;
padding:25px;
border:1px solid #263246;
border-radius:12px;
background:#111827;
animation:fadeUp 0.8s ease forwards;
opacity:0;
animation-delay:0.35s;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(12px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* =========================
   LINKS GRID
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:900px;
margin:40px auto;
padding:0 20px;
}

.grid .box{
background:#111827;
border:1px solid #263246;
border-radius:12px;
padding:20px;
cursor:pointer;
transition:0.2s;
animation:fadeUp 0.8s ease forwards;
opacity:0;
}

.grid .box:hover{
transform:translateY(-4px);
border-color:#4aa3ff;
}

.grid .box:nth-child(1){animation-delay:0.3s;}
.grid .box:nth-child(2){animation-delay:0.4s;}
.grid .box:nth-child(3){animation-delay:0.5s;}

/* FOOTER */

footer{
text-align:center;
padding:40px;
opacity:0.5;
font-size:12px;
}
</style>

</head>

<body>

<div class="world-banner" data-i18n="banner">
G-ROCK • Digital Universe • G-System Active • Gibraltar Node
</div>

<header>

<div class="logo">G-ROCK</div>

<nav>
<a href="index.html" data-i18n="home">Home</a>
<a href="map.html" data-i18n="map">Map</a>
<a href="season1.html" data-i18n="episodes">Episodes</a>
<a href="g-system.html" data-i18n="system">System</a>
</nav>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('pl')">PL</button>
<button onclick="setLang('fr')">FR</button>
</div>

</header>

<section class="hero">

<h1>G-ROCK</h1>
<p data-i18n="subtitle">Powered by G-System</p>

</section>

<div class="card">
<h2>Professor Sugriva</h2>
<p data-i18n="sugriva">
First documented subject integrated into G-System academic layer (ESL / BSU classification).
</p>
</div>

<div class="grid">

<div class="box" onclick="location.href='map.html'">
World Map
</div>

<div class="box" onclick="location.href='season1.html'">
Episodes
</div>

<div class="box" onclick="location.href='g-system.html'">
System Core
</div>

</div>

<footer>
G-ROCK • Powered by G-System
</footer>

<script>

const translations = {
en:{
subtitle:"Powered by G-System",
sugriva:"First documented subject integrated into G-System academic layer (ESL / BSU classification)."
},
es:{
subtitle:"Impulsado por G-System",
sugriva:"Primer sujeto documentado integrado en la capa académica del sistema."
},
pl:{
subtitle:"Napędzane przez G-System",
sugriva:"Pierwszy udokumentowany obiekt w systemie akademickim (ESL / BSU)."
},
fr:{
subtitle:"Propulsé par G-System",
sugriva:"Premier sujet documenté intégré au système académique."
}
};

function setLang(lang){
document.querySelectorAll("[data-i18n]").forEach(el=>{
const key = el.getAttribute("data-i18n");
if(translations[lang][key]){
el.innerText = translations[lang][key];
}
});
}

</script>

</body>
  </html>
