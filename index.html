<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<style>
body{
margin:0;
background:#070A10;
color:#E6E6E6;
font-family:Arial, sans-serif;
opacity:0;
animation:boot 0.8s ease forwards;
overflow-x:hidden;
}

/* BOOT ANIMATION */
@keyframes boot{
from{
opacity:0;
transform:translateY(12px);
filter:blur(6px);
}
to{
opacity:1;
transform:translateY(0);
filter:blur(0);
}
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
border-bottom:1px solid #1f2a3a;
}

.logo{
font-weight:bold;
letter-spacing:2px;
}

nav a{
color:#fff;
text-decoration:none;
margin-right:14px;
opacity:0.8;
transition:0.2s;
}

nav a:hover{
color:#4aa3ff;
opacity:1;
}

/* LANG */
.lang button{
background:none;
border:1px solid #4aa3ff;
color:#4aa3ff;
padding:4px 8px;
margin-left:5px;
cursor:pointer;
}

.lang button:hover{
background:#4aa3ff;
color:#000;
}

/* HERO */
.hero{
text-align:center;
padding:80px 20px 30px;
}

.hero h1{
font-size:64px;
letter-spacing:8px;
margin:0;
}

.hero p{
opacity:0.7;
}

/* CARD */
.card{
max-width:800px;
margin:30px auto;
padding:25px;
border:1px solid #263246;
border-radius:12px;
background:#111827;
animation:fadeUp 0.8s ease forwards;
opacity:0;
animation-delay:0.3s;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:900px;
margin:40px auto;
padding:0 20px;
}

.box{
background:#111827;
border:1px solid #263246;
border-radius:12px;
padding:20px;
cursor:pointer;
transition:0.2s;
opacity:0;
animation:fadeUp 0.8s ease forwards;
}

.box:hover{
transform:translateY(-4px);
border-color:#4aa3ff;
}

.box:nth-child(1){animation-delay:0.3s;}
.box:nth-child(2){animation-delay:0.4s;}
.box:nth-child(3){animation-delay:0.5s;}

/* ANIMATION */
@keyframes fadeUp{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

/* FOOTER */
footer{
text-align:center;
padding:40px;
opacity:0.5;
font-size:12px;
}
</style>
</head>

<body>

<header>
<div class="logo">G-ROCK</div>

<nav>
<a href="index.html">Home</a>
<a href="map.html">Map</a>
<a href="season1.html">Episodes</a>
<a href="g-system.html">System</a>
</nav>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('pl')">PL</button>
<button onclick="setLang('fr')">FR</button>
</div>
</header>

<section class="hero">
<h1>G-ROCK</h1>
<p>Powered by G-System</p>
</section>

<div class="card">
<h2>Professor Sugriva</h2>
<p>
First documented subject integrated into academic system (ESL / BSU classification).
</p>
</div>

<div class="grid">
<div class="box" onclick="location.href='map.html'">World Map</div>
<div class="box" onclick="location.href='season1.html'">Episodes</div>
<div class="box" onclick="location.href='g-system.html'">System Core</div>
</div>

<footer>
G-ROCK • Powered by G-System
</footer>

<script>
function setLang(lang){
const text = {
en:"Powered by G-System",
es:"Impulsado por G-System",
pl:"Napędzane przez G-System",
fr:"Propulsé par G-System"
};
document.querySelector(".hero p").innerText = text[lang];
}
</script>

</body>
</html>
